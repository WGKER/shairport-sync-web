name: Build ARM64 Image (Manual)

# 仅手动触发
on:
  workflow_dispatch:

# 全局变量
env:
  IMAGE_NAME: shairport-sync-web
  IMAGE_TAG: arm64-5.0.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 模拟)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 构建 ARM64 镜像 → 输出为 tar 文件
      - name: Build ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --output type=docker,dest=${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar \
            .

      # 上传构建好的镜像文件
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          path: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
