name: Build ARM64 shairport-sync-web docker image

# 仅手动触发
on:
  workflow_dispatch:

# 全局变量
env:
  IMAGE_NAME: shairport-sync-web
  IMAGE_TAG: arm64-5.0.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 安装 Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      # 2. 编译 ARM64 静态二进制（无任何依赖）
      - name: Build Go ARM64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o webui main.go


      - name: Set up QEMU (ARM64 模拟)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 构建 ARM64 镜像 → 输出为 tar 文件
      - name: Build ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --output type=docker,dest=${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar \
            .

      # 上传构建好的镜像文件
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          path: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
